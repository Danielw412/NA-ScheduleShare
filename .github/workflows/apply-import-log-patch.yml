# Validation trigger 2.
name: Apply importer logging changes

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-import-log-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'codex/import-log-details-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/import-log-details-20260806
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Apply code changes
        run: python .github/scripts/apply_import_log_patch.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run Edge Function tests
        run: pnpm test:function

      - name: Run type checks
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Remove temporary branch files
        run: |
          rm .github/scripts/apply_import_log_patch.py
          rm .github/workflows/apply-import-log-patch.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add detailed schedule import failure and correction logs"
          git push origin HEAD:codex/import-log-details-20260806
