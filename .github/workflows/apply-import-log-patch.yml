name: Apply importer logging changes

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-import-log-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'import-log-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: import-log-integration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Apply code changes
        run: python .github/scripts/apply_import_log_patch.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run Edge Function tests
        run: pnpm test:function

      - name: Run type checks
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Remove temporary validation files
        run: |
          rm -f .github/scripts/apply_import_log_patch.py
          rm -f .github/import-log-validation-trigger
          rm -f .github/workflows/apply-import-log-patch.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add detailed schedule import failure and correction logs"
          git push origin HEAD:import-log-integration
