name: Verify production share fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Worker deploy runs and live share endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: b7d55067169def0193fe9d2645b98a4d8fb5823b
        run: |
          set -euo pipefail

          deployed=0
          for attempt in $(seq 1 20); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/workflows/deploy-worker.yml/runs?per_page=20" \
              > /tmp/runs.json

            python - <<'PY'
          import json, os
          data=json.load(open('/tmp/runs.json', encoding='utf-8'))
          expected=os.environ['EXPECTED_SHA']
          matches=[r for r in data.get('workflow_runs', []) if r.get('head_sha') == expected]
          if matches:
              r=matches[0]
              print(f"worker_run id={r.get('id')} status={r.get('status')} conclusion={r.get('conclusion')} event={r.get('event')}")
          else:
              print('worker_run not_found')
          PY

            state=$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/runs.json', encoding='utf-8'))
          expected=os.environ['EXPECTED_SHA']
          matches=[r for r in data.get('workflow_runs', []) if r.get('head_sha') == expected]
          if not matches:
              print('not_found')
          else:
              r=matches[0]
              print(f"{r.get('status')}:{r.get('conclusion')}")
          PY
          )

            if [ "$state" = 'completed:success' ]; then
              deployed=1
              break
            fi
            if [[ "$state" == completed:* ]] && [ "$state" != 'completed:success' ]; then
              echo "Worker deployment failed: $state"
              exit 1
            fi
            sleep 3
          done

          test "$deployed" = 1

          URL='https://schedule-api.naclubs.net/share/e81658a5-bbb6-4d0e-8cc2-6dc3a9200875'
          page_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/page.html --write-out '%{http_code}' "$URL")
          image_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/image.png --write-out '%{http_code}' "$URL/image.png")

          echo "page_status=$page_status"
          grep -o '<title>[^<]*</title>' /tmp/page.html || true
          echo "image_status=$image_status"
          file /tmp/image.png || true
          wc -c /tmp/image.png || true

          test "$page_status" = 200
          test "$image_status" = 200
          grep -q '<title>Schedule | NA ScheduleShare</title>' /tmp/page.html
          grep -q '<meta property="og:title" content="Schedule | NA ScheduleShare">' /tmp/page.html
          file /tmp/image.png | grep -q 'PNG image data, 1200 x 630'
