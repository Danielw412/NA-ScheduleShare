name: Diagnose production share endpoint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-minimal-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate redirect manual in Cloudflare remote runtime
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          path = Path('cloudflare/schedule-import-worker/src/share.ts')
          text = path.read_text(encoding='utf-8')
          old = "      redirect: 'error',\n"
          new = "      redirect: 'manual',\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one redirect:error, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > cloudflare/schedule-import-worker/.dev.vars <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          EOF
          chmod 600 cloudflare/schedule-import-worker/.dev.vars

          rm -f /tmp/remote-worker.log /tmp/page-body.txt /tmp/page-headers.txt /tmp/image.bin /tmp/image-headers.txt
          timeout 60s pnpm exec wrangler dev --remote \
            --config cloudflare/schedule-import-worker/wrangler.toml \
            --ip 127.0.0.1 --port 8787 \
            > /tmp/remote-worker.log 2>&1 &
          worker_pid=$!

          ready=0
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null --connect-timeout 1 http://127.0.0.1:8787/ 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          echo "remote_ready=$ready"
          if [ "$ready" != 1 ]; then
            cat /tmp/remote-worker.log
            exit 1
          fi

          page_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --dump-header /tmp/page-headers.txt --output /tmp/page-body.txt --write-out '%{http_code}' \
            'http://127.0.0.1:8787/share/e81658a5-bbb6-4d0e-8cc2-6dc3a9200875')
          echo "page_status=$page_status"
          grep -o '<title>[^<]*</title>' /tmp/page-body.txt || true

          image_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --dump-header /tmp/image-headers.txt --output /tmp/image.bin --write-out '%{http_code}' \
            'http://127.0.0.1:8787/share/e81658a5-bbb6-4d0e-8cc2-6dc3a9200875/image.png')
          echo "image_status=$image_status"
          file /tmp/image.bin || true
          wc -c /tmp/image.bin || true

          kill "$worker_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          echo '--- remote worker log ---'
          cat /tmp/remote-worker.log

          test "$page_status" = 200
          test "$image_status" = 200
          grep -q '<title>A/B-Day Schedule | NA ScheduleShare</title>' /tmp/page-body.txt
          file /tmp/image.bin | grep -q 'PNG image data, 1200 x 630'

          rm -f cloudflare/schedule-import-worker/.dev.vars
