name: Deploy and verify production share title

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch production Worker and verify live share endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: 6dbdde6eed490b6e9a56a92312a77eb91bed7f2a
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-worker.yml/dispatches" \
            --data '{"ref":"main"}'
          echo 'Worker deployment dispatched for main.'

          deployed=0
          run_id=''
          for attempt in $(seq 1 60); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/workflows/deploy-worker.yml/runs?event=workflow_dispatch&per_page=20" \
              > /tmp/runs.json

            result=$(python - <<'PY'
          import json, os
          data=json.load(open('/tmp/runs.json', encoding='utf-8'))
          expected=os.environ['EXPECTED_SHA']
          matches=[r for r in data.get('workflow_runs', []) if r.get('head_sha') == expected]
          if not matches:
              print('not_found')
          else:
              r=max(matches, key=lambda x: x.get('created_at') or '')
              print(f"{r.get('id')}|{r.get('status')}|{r.get('conclusion')}")
          PY
          )
            echo "worker_run=$result"

            if [ "$result" != 'not_found' ]; then
              run_id=${result%%|*}
              rest=${result#*|}
              status=${rest%%|*}
              conclusion=${rest#*|}
              if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then
                deployed=1
                break
              fi
              if [ "$status" = 'completed' ] && [ "$conclusion" != 'success' ]; then
                echo "Worker deployment failed: run=$run_id conclusion=$conclusion"
                exit 1
              fi
            fi
            sleep 3
          done

          test "$deployed" = 1
          echo "Worker deployment succeeded: run=$run_id"

          URL='https://schedule-api.naclubs.net/share/e81658a5-bbb6-4d0e-8cc2-6dc3a9200875'
          page_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/page.html --write-out '%{http_code}' "$URL")
          image_status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/image.png --write-out '%{http_code}' "$URL/image.png")

          echo "page_status=$page_status"
          grep -o '<title>[^<]*</title>' /tmp/page.html || true
          echo "image_status=$image_status"
          file /tmp/image.png || true
          wc -c /tmp/image.png || true

          test "$page_status" = 200
          test "$image_status" = 200
          grep -q '<title>My Schedule | NA ScheduleShare</title>' /tmp/page.html
          grep -q '<meta property="og:title" content="My Schedule | NA ScheduleShare">' /tmp/page.html
          grep -q '<meta name="twitter:title" content="My Schedule | NA ScheduleShare">' /tmp/page.html
          file /tmp/image.png | grep -q 'PNG image data, 1200 x 630'
