name: Apply enrolled class delete confirmation

on:
  push:
    branches:
      - fix/confirm-delete-enrolled-class

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/confirm-delete-enrolled-class
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focused class delete confirmation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminPage.tsx')
          text = path.read_text()
          old = """  function permanentlyDeleteClass(course: AdminClassRecord) {
    void adminAction('admin_delete_class_section', { p_class_id: course.id, p_reason: 'Permanently deleted from admin console' }, `${course.course_name} was permanently deleted.`)
  }
"""
          new = """  function permanentlyDeleteClass(course: AdminClassRecord) {
    if (course.active_enrollment_count > 0) {
      const count = course.active_enrollment_count
      const confirmed = window.confirm(`Delete ${course.course_name} with ${course.teacher_last_name}? ${count} active student${count === 1 ? '' : 's'} ${count === 1 ? 'is' : 'are'} currently enrolled.`)
      if (!confirmed) return
    }
    void adminAction('admin_delete_class_section', { p_class_id: course.id, p_reason: 'Permanently deleted from admin console' }, `${course.course_name} was permanently deleted.`)
  }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one delete handler match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-confirm-delete-enrolled-class.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --run
      - name: Commit tested change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.tsx .github/workflows/apply-confirm-delete-enrolled-class.yml
          git commit -m "Confirm deletion of actively enrolled classes"
          git push origin HEAD:fix/confirm-delete-enrolled-class
