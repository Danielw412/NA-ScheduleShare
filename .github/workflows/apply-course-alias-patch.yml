name: Apply course alias patch

on:
  push:
    branches: [course-name-aliases]
    paths:
      - scripts/apply_course_alias_patch.py
      - .github/workflows/apply-course-alias-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-name-aliases
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/apply_course_alias_patch.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire course aliases into importer and admin"
          git push origin HEAD:course-name-aliases
