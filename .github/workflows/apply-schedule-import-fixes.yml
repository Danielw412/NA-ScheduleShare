name: Apply schedule import review fixes

on:
  push:
    branches:
      - fix/schedule-import-review-rules

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-import-review-rules
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focused fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          core = "supabase/functions/schedule-import/core.ts"

          replace_once(core, """  const courseIds = [...new Set(campusRows.flatMap((row) => {
              const match = findCourseMatch(row.source_course_name, catalog)
              return match.course ? [match.course.id] : []
            }))]
            const classes = await dependencies.loadClasses(token, config, courseIds)
            validateBackendData(catalog, classes)
            return {
              parsed,
              estimatedGrade,
              rows: buildReviewRows(campusRows, catalog, classes, dependencies.randomUUID),
            }""", """  const courseIds = [...new Set(campusRows.flatMap((row) => {
              const match = findCourseMatch(row.source_course_name, catalog, estimatedGrade)
              return match.course ? [match.course.id] : []
            }))]
            const classes = await dependencies.loadClasses(token, config, courseIds)
            validateBackendData(catalog, classes)
            return {
              parsed,
              estimatedGrade,
              rows: buildReviewRows(campusRows, catalog, classes, estimatedGrade, dependencies.randomUUID),
            }""")

          replace_once(core, """export function findCourseMatch(sourceName: string, catalog: CourseRecord[]): CourseMatch {
            const ranked = catalog
              .map((course) => ({
                course,
                score: Math.max(
                  courseSimilarity(sourceName, course.name),
                  ...(course.aliases ?? []).map((alias) => courseSimilarity(sourceName, alias)),
                ),
              }))
              .sort((left, right) => right.score - left.score || left.course.name.localeCompare(right.course.name))
            const best = ranked[0]
            const second = ranked[1]
            if (!best) return { kind: 'unresolved', course: null, score: 0, alternatives: [] }
            const margin = best.score - (second?.score ?? 0)
            if (best.score >= 0.995 || (best.score >= 0.93 && margin >= 0.03) || (best.score >= 0.86 && margin >= 0.08)) {
              return { kind: 'matched', course: best.course, score: best.score, alternatives: [] }
            }
            if (best.score >= 0.72 && second && second.score >= 0.68 && margin < 0.08) {
              return {
                kind: 'ambiguous',
                course: null,
                score: best.score,
                alternatives: ranked.slice(0, 3).map((candidate) => candidate.course),
              }
            }
            return { kind: 'unresolved', course: null, score: best.score, alternatives: ranked.slice(0, 3).map((candidate) => candidate.course) }
          }

          function buildReviewRows(
            entries: NormalizedGeminiRow[],
            catalog: CourseRecord[],
            classes: ExistingClassRecord[],
            randomUUID: (() => string) | undefined,
          ): ImportReviewRow[] {
            const matchedEntries = entries.map((entry) => {
              const match = findCourseMatch(entry.source_course_name, catalog)
              const policy = match.course?.term_policy ?? 'full_year'
              const resolvedEntry = match.course && policy === 'full_year' && entry.term === 'unknown'
                ? { ...entry, term: 'full_year' as const, term_defaulted: true }
                : entry
              return { match, policy, resolvedEntry }
            })""", """function campusAdjustedCourseScore(sourceName: string, courseName: string, score: number, grade?: Grade): number {
            if (!grade) return score
            const source = normalizeCourseName(sourceName)
            if (/(?:^| )(?:nai|nash)(?: |$)/.test(source)) return score
            const candidate = normalizeCourseName(courseName)
            const expectedCampus = grade <= 10 ? 'nai' : 'nash'
            const otherCampus = expectedCampus === 'nai' ? 'nash' : 'nai'
            if (candidate.endsWith(` ${expectedCampus}`)) return Math.min(1, score + 0.03)
            if (candidate.endsWith(` ${otherCampus}`)) return Math.max(0, score - 0.03)
            return score
          }

          export function findCourseMatch(sourceName: string, catalog: CourseRecord[], grade?: Grade): CourseMatch {
            const ranked = catalog
              .map((course) => {
                const rawScore = Math.max(
                  courseSimilarity(sourceName, course.name),
                  ...(course.aliases ?? []).map((alias) => courseSimilarity(sourceName, alias)),
                )
                return { course, score: campusAdjustedCourseScore(sourceName, course.name, rawScore, grade) }
              })
              .sort((left, right) => right.score - left.score || left.course.name.localeCompare(right.course.name))
            const best = ranked[0]
            const second = ranked[1]
            if (!best) return { kind: 'unresolved', course: null, score: 0, alternatives: [] }
            const margin = best.score - (second?.score ?? 0)
            if (best.score >= 0.995 || (best.score >= 0.93 && margin >= 0.03) || (best.score >= 0.86 && margin >= 0.08)) {
              return { kind: 'matched', course: best.course, score: best.score, alternatives: [] }
            }
            if (best.score >= 0.72 && second && second.score >= 0.68 && margin < 0.08) {
              return {
                kind: 'ambiguous',
                course: null,
                score: best.score,
                alternatives: ranked.slice(0, 3).map((candidate) => candidate.course),
              }
            }
            return { kind: 'unresolved', course: null, score: best.score, alternatives: ranked.slice(0, 3).map((candidate) => candidate.course) }
          }

          function completeLunchMeetingSlots(slots: MeetingSlot[]): MeetingSlot[] {
            if (slots.length !== 1) return slots
            const slot = slots[0]
            return sortSlots([
              slot,
              { day_type: slot.day_type === 'A' ? 'B' : 'A', period_number: slot.period_number },
            ])
          }

          function buildReviewRows(
            entries: NormalizedGeminiRow[],
            catalog: CourseRecord[],
            classes: ExistingClassRecord[],
            grade: Grade,
            randomUUID: (() => string) | undefined,
          ): ImportReviewRow[] {
            const matchedEntries = entries.map((entry) => {
              const match = findCourseMatch(entry.source_course_name, catalog, grade)
              const policy = match.course?.term_policy ?? 'full_year'
              const normalizedEntry = match.course && policy === 'lunch'
                ? { ...entry, meeting_slots: completeLunchMeetingSlots(entry.meeting_slots) }
                : entry
              const resolvedEntry = match.course && policy === 'full_year' && normalizedEntry.term === 'unknown'
                ? { ...normalizedEntry, term: 'full_year' as const, term_defaulted: true }
                : normalizedEntry
              return { match, policy, resolvedEntry }
            })""")

          replace_once(core, """    const options = match.course ? classOptionsFor(match.course, classes) : []
              const teacherLastName = parseTeacherLastName(resolvedEntry.teacher_raw, match.course?.name ?? resolvedEntry.source_course_name)
              const existing = match.course ? exactClassMatch(resolvedEntry, teacherLastName, options, policy) : null
              const flags: ImportReviewRow['flags'] = []""", """    const options = match.course ? classOptionsFor(match.course, classes) : []
              const courseName = match.course?.name ?? resolvedEntry.source_course_name
              const missingTeacher = !resolvedEntry.teacher_raw && !specialCourseKind(courseName)
              const parsedTeacherLastName = parseTeacherLastName(resolvedEntry.teacher_raw, courseName)
              const existing = match.course
                ? exactClassMatch(resolvedEntry, parsedTeacherLastName, options, policy, missingTeacher)
                : null
              const teacherLastName = missingTeacher && existing ? existing.teacher_last_name : parsedTeacherLastName
              const flags: ImportReviewRow['flags'] = []""")

          replace_once(core, """    const formatError = match.course ? courseFormatError(policy, resolvedEntry.term, resolvedEntry.meeting_slots) : null""",
                       """    const formatError = match.course ? courseFormatError(policy, resolvedEntry.term, resolvedEntry.meeting_slots, courseName) : null""")

          replace_once(core, """    if (!resolvedEntry.teacher_raw && !specialCourseKind(match.course?.name ?? resolvedEntry.source_course_name)) {
              if (!flags.includes('incomplete')) flags.push('incomplete')
              warnings.push('The teacher name could not be read confidently.')
            }""", """    if (missingTeacher && !existing) {
              if (!flags.includes('incomplete')) flags.push('incomplete')
              warnings.push('The teacher name could not be read confidently.')
            }""")

          replace_once(core, """function courseFormatError(policy: CourseTermPolicy, term: ImportTerm, slots: MeetingSlot[]): string | null {
            if (term === 'unknown') return null
            const aSlots = slots.filter((slot) => slot.day_type === 'A')
            const bSlots = slots.filter((slot) => slot.day_type === 'B')
            if (policy === 'full_year' && term !== 'full_year') return 'This catalogue course is full year, but the screenshot was read as semester-only.'
            if (policy === 'semester' && term === 'full_year') return 'This half-credit course must be assigned to Semester 1 or Semester 2.'
            if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') {
              if (term === 'full_year' && slots.length !== 1) return 'Full-year Gym, Wellness, or Study Hall must meet only on A days or only on B days.'
              if (term !== 'full_year' && (slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1)) {
                return 'Semester Gym, Wellness, or Study Hall must meet every A and B day.'
              }
              if (term !== 'full_year' && aSlots[0]?.period_number !== bSlots[0]?.period_number) {
                return 'Semester Gym, Wellness, or Study Hall must use the same period every day.'
              }
            }
            if (policy === 'lunch' && (slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1 || aSlots[0].period_number !== bSlots[0].period_number)) {
              return 'Lunch must use the same period on every A and B day.'
            }
            return null
          }""", """function courseFormatError(policy: CourseTermPolicy, term: ImportTerm, slots: MeetingSlot[], courseName = ''): string | null {
            if (term === 'unknown') return null
            const aSlots = slots.filter((slot) => slot.day_type === 'A')
            const bSlots = slots.filter((slot) => slot.day_type === 'B')
            const fullYearStudyHallEveryDay = specialCourseKind(courseName) === 'Study Hall'
              && slots.length === 2
              && aSlots.length === 1
              && bSlots.length === 1
              && aSlots[0].period_number === bSlots[0].period_number
            if (policy === 'full_year' && term !== 'full_year') return 'This catalogue course is full year, but the screenshot was read as semester-only.'
            if (policy === 'semester' && term === 'full_year') return 'This half-credit course must be assigned to Semester 1 or Semester 2.'
            if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') {
              if (term === 'full_year' && slots.length !== 1 && !fullYearStudyHallEveryDay) {
                return specialCourseKind(courseName) === 'Study Hall'
                  ? 'Full-year Study Hall must meet on one day type or the same period on both A and B days.'
                  : 'Full-year Gym, Wellness, or Study Hall must meet only on A days or only on B days.'
              }
              if (term !== 'full_year' && (slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1)) {
                return 'Semester Gym, Wellness, or Study Hall must meet every A and B day.'
              }
              if (term !== 'full_year' && aSlots[0]?.period_number !== bSlots[0].period_number) {
                return 'Semester Gym, Wellness, or Study Hall must use the same period every day.'
              }
            }
            if (policy === 'lunch' && (slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1 || aSlots[0].period_number !== bSlots[0].period_number)) {
              return 'Lunch must use the same period on every A and B day.'
            }
            return null
          }""")

          replace_once(core, """function exactClassMatch(
            entry: NormalizedGeminiRow,
            teacherLastName: string,
            options: ImportClassOption[],
            policy: CourseTermPolicy,
          ): ImportClassOption | null {
            if (entry.term === 'unknown') return null
            const key = slotsKey(entry.meeting_slots)
            return options.find((option) => (
              collapseWhitespace(option.teacher_last_name).toLowerCase() === teacherLastName.toLowerCase()
              && (policy === 'flexible_attendance'
                ? periodsKey(option.meeting_slots) === periodsKey(entry.meeting_slots)
                : policy === 'lunch'
                  ? slotsKey(option.meeting_slots) === key
                  : option.term === entry.term && slotsKey(option.meeting_slots) === key)
            )) ?? null
          }""", """function exactClassMatch(
            entry: NormalizedGeminiRow,
            teacherLastName: string,
            options: ImportClassOption[],
            policy: CourseTermPolicy,
            allowUniqueTeacherFallback = false,
          ): ImportClassOption | null {
            if (entry.term === 'unknown') return null
            const key = slotsKey(entry.meeting_slots)
            const scheduleMatches = options.filter((option) => (
              policy === 'flexible_attendance'
                ? periodsKey(option.meeting_slots) === periodsKey(entry.meeting_slots)
                : policy === 'lunch'
                  ? slotsKey(option.meeting_slots) === key
                  : option.term === entry.term && slotsKey(option.meeting_slots) === key
            ))
            const teacherMatch = scheduleMatches.find((option) => (
              collapseWhitespace(option.teacher_last_name).toLowerCase() === teacherLastName.toLowerCase()
            ))
            if (teacherMatch) return teacherMatch
            return allowUniqueTeacherFallback && scheduleMatches.length === 1 ? scheduleMatches[0] : null
          }""")

          replace_once(core, """    .replace(/\bhon\b/g, 'honors')
              .replace(/\bmod\b/g, 'modern')""", """    .replace(/\bacad\b/g, 'academic')
              .replace(/\bhon\b/g, 'honors')
              .replace(/\bmod\b/g, 'modern')""")
          replace_once(core, """    .replace(/\bchem\b/g, 'chemistry')
              .replace(/\blang\b/g, 'language')""", """    .replace(/\bchem\b/g, 'chemistry')
              .replace(/\benvironment\b/g, 'environmental')
              .replace(/\blang\b/g, 'language')""")

          replace_once(core, """function courseSimilarity(left: string, right: string): number {
            const normalizedLeft = normalizeCourseName(left)
            const normalizedRight = normalizeCourseName(right)
            if (!normalizedLeft || !normalizedRight) return 0
            if (normalizedLeft === normalizedRight) return 1
            const leftTokens = new Set(normalizedLeft.split(' '))
            const rightTokens = new Set(normalizedRight.split(' '))
            let shared = 0
            for (const token of leftTokens) if (rightTokens.has(token)) shared += 1
            const dice = (2 * shared) / (leftTokens.size + rightTokens.size)
            const edit = 1 - levenshtein(normalizedLeft, normalizedRight) / Math.max(normalizedLeft.length, normalizedRight.length)
            const containment = normalizedLeft.includes(normalizedRight) || normalizedRight.includes(normalizedLeft) ? 0.88 : 0
            return Math.max(containment, dice * 0.68 + edit * 0.32)
          }""", """function truncatedCoursePrefixSimilarity(source: string, candidate: string): number {
            const trimmed = collapseWhitespace(source)
            if (!/(?:\.{3,}|…)$/.test(trimmed)) return 0
            const visible = trimmed.replace(/(?:\.{3,}|…)$/, '').trim()
            const normalizedVisible = normalizeCourseName(visible)
            const normalizedCandidate = normalizeCourseName(candidate)
            if (!normalizedVisible || !normalizedCandidate) return 0
            if (normalizedCandidate.startsWith(normalizedVisible)) return 0.98

            const visibleTokens = normalizedVisible.split(' ')
            if (visibleTokens.length < 2) return 0
            const partialToken = visibleTokens.at(-1) ?? ''
            const prefix = visibleTokens.slice(0, -1).join(' ')
            if (!prefix) return 0
            if (normalizedCandidate === prefix) return 0.98
            if (!normalizedCandidate.startsWith(`${prefix} `)) return 0
            const nextToken = normalizedCandidate.slice(prefix.length).trim().split(' ')[0] ?? ''
            return partialToken.length >= 2 && nextToken.startsWith(partialToken) ? 0.98 : 0
          }

          function courseSimilarity(left: string, right: string): number {
            const normalizedLeft = normalizeCourseName(left)
            const normalizedRight = normalizeCourseName(right)
            if (!normalizedLeft || !normalizedRight) return 0
            if (normalizedLeft === normalizedRight) return 1
            const leftTokens = new Set(normalizedLeft.split(' '))
            const rightTokens = new Set(normalizedRight.split(' '))
            let shared = 0
            for (const token of leftTokens) if (rightTokens.has(token)) shared += 1
            const dice = (2 * shared) / (leftTokens.size + rightTokens.size)
            const edit = 1 - levenshtein(normalizedLeft, normalizedRight) / Math.max(normalizedLeft.length, normalizedRight.length)
            const containment = normalizedLeft.includes(normalizedRight) || normalizedRight.includes(normalizedLeft) ? 0.88 : 0
            return Math.max(truncatedCoursePrefixSimilarity(left, right), containment, dice * 0.68 + edit * 0.32)
          }""")

          frontend = "src/lib/scheduleImport.ts"
          replace_once(frontend, """  if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') {
              if (row.term === 'full_year' && row.meeting_slots.length !== 1) return 'Full-year Gym, Wellness, or Study Hall must meet on only A days or only B days.'
              if (row.term !== 'full_year' && (row.meeting_slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1)) return 'Semester Gym, Wellness, or Study Hall must meet every day.'
              if (row.term !== 'full_year' && aSlots[0]?.period_number !== bSlots[0]?.period_number) return 'Semester Gym, Wellness, or Study Hall must use the same period every day.'
            }""", """  if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') {
              const fullYearStudyHallEveryDay = specialCourseKind(row.course.name) === 'Study Hall'
                && row.meeting_slots.length === 2
                && aSlots.length === 1
                && bSlots.length === 1
                && aSlots[0].period_number === bSlots[0].period_number
              if (row.term === 'full_year' && row.meeting_slots.length !== 1 && !fullYearStudyHallEveryDay) {
                return specialCourseKind(row.course.name) === 'Study Hall'
                  ? 'Full-year Study Hall must meet on one day type or the same period on both A and B days.'
                  : 'Full-year Gym, Wellness, or Study Hall must meet on only A days or only B days.'
              }
              if (row.term !== 'full_year' && (row.meeting_slots.length !== 2 || aSlots.length !== 1 || bSlots.length !== 1)) return 'Semester Gym, Wellness, or Study Hall must meet every day.'
              if (row.term !== 'full_year' && aSlots[0]?.period_number !== bSlots[0]?.period_number) return 'Semester Gym, Wellness, or Study Hall must use the same period every day.'
            }""")

          replace_once(frontend, """export function editableRowsFromImportResult(result: ScheduleImportResult): EditableScheduleImportRow[] {
            return result.rows.map((row) => {
              const savedReview = row as ScheduleImportRow & Partial<Pick<EditableScheduleImportRow, 'include' | 'selected_existing_class_id'>>
              const normalizedTerm = normalizeReviewTerm(row.term)
              return reconcileExactClassSelection({
                ...row,
                term: normalizedTerm === 'unknown' && (row.course?.term_policy ?? 'full_year') === 'full_year'
                  ? 'full_year'
                  : normalizedTerm,
                selected_existing_class_id: savedReview.selected_existing_class_id ?? row.existing_class_id,
                include: savedReview.include ?? true,
              })
            })
          }""", """function completeImportedLunchSlots(row: Pick<ScheduleImportRow, 'course' | 'meeting_slots'>): MeetingSlot[] {
            const isLunch = row.course?.term_policy === 'lunch' || specialCourseKind(row.course?.name) === 'Lunch'
            if (!isLunch || row.meeting_slots.length !== 1) return row.meeting_slots
            const slot = row.meeting_slots[0]
            return sortMeetingSlots([
              slot,
              { day_type: slot.day_type === 'A' ? 'B' : 'A', period_number: slot.period_number },
            ])
          }

          export function editableRowsFromImportResult(result: ScheduleImportResult): EditableScheduleImportRow[] {
            return result.rows.map((row) => {
              const savedReview = row as ScheduleImportRow & Partial<Pick<EditableScheduleImportRow, 'include' | 'selected_existing_class_id'>>
              const normalizedTerm = normalizeReviewTerm(row.term)
              return reconcileExactClassSelection({
                ...row,
                meeting_slots: completeImportedLunchSlots(row),
                term: normalizedTerm === 'unknown' && (row.course?.term_policy ?? 'full_year') === 'full_year'
                  ? 'full_year'
                  : normalizedTerm,
                selected_existing_class_id: savedReview.selected_existing_class_id ?? row.existing_class_id,
                include: savedReview.include ?? true,
              })
            })
          }""")

          dialog = "src/components/schedule/AddClassDialog.tsx"
          replace_once(dialog, """function scheduleRuleError(policy: CourseTermPolicy, term: AcademicTerm, meetingSlots: MeetingSlot[], isDoublePeriod: boolean): string | null {""",
                       """function scheduleRuleError(policy: CourseTermPolicy, term: AcademicTerm, meetingSlots: MeetingSlot[], isDoublePeriod: boolean, courseName = ''): string | null {""")
          replace_once(dialog, """    if (term === 'full_year' && meetingSlots.length !== 1) return 'A full-year entry must meet only on A days or only on B days.'""",
                       """    const fullYearStudyHallEveryDay = isStudyHallCourseName(courseName)
                && meetingSlots.length === 2
                && aSlots.length === 1
                && bSlots.length === 1
                && aSlots[0].period_number === bSlots[0].period_number
              if (term === 'full_year' && meetingSlots.length !== 1 && !fullYearStudyHallEveryDay) return 'A full-year entry must meet only on A days or only on B days.'""")
          replace_once(dialog, """  const meetingSlotError = mode === 'search' && !selected ? null : scheduleRuleError(activePolicy, term, meetingSlots, isDoublePeriod)""",
                       """  const meetingSlotError = mode === 'search' && !selected ? null : scheduleRuleError(activePolicy, term, meetingSlots, isDoublePeriod, activeCourseName)""")
          replace_once(dialog, """{selected ? <SelectedAttendanceControls policy={selectedPolicy} term={term} meetingSlots={meetingSlots} dayType={dayType} period={period} onChange={(nextTerm, nextSlots) => { setTerm(nextTerm); setMeetingSlots(nextSlots) }} /> : null}""",
                       """{selected ? <SelectedAttendanceControls policy={selectedPolicy} courseName={selected.course_name} term={term} meetingSlots={meetingSlots} dayType={dayType} period={period} onChange={(nextTerm, nextSlots) => { setTerm(nextTerm); setMeetingSlots(nextSlots) }} /> : null}""")
          replace_once(dialog, """<NewCourseFormatControls policy={creatingPolicy} term={term} meetingSlots={meetingSlots} dayType={dayType} period={period} onChange={(nextTerm, nextSlots) => { setTerm(nextTerm); setMeetingSlots(nextSlots) }} />""",
                       """<NewCourseFormatControls policy={creatingPolicy} courseName={activeCourseName} term={term} meetingSlots={meetingSlots} dayType={dayType} period={period} onChange={(nextTerm, nextSlots) => { setTerm(nextTerm); setMeetingSlots(nextSlots) }} />""")
          replace_once(dialog, """function SelectedAttendanceControls({ policy, term, meetingSlots, dayType, period, onChange }: {
            policy: CourseTermPolicy
            term: AcademicTerm""", """function SelectedAttendanceControls({ policy, courseName, term, meetingSlots, dayType, period, onChange }: {
            policy: CourseTermPolicy
            courseName: string
            term: AcademicTerm""")
          replace_once(dialog, """  if (policy === 'flexible_attendance') return <FlexibleAttendanceControls fixedPeriod={meetingSlots[0]?.period_number ?? period} term={term} meetingSlots={meetingSlots} onChange={onChange} />""",
                       """  if (policy === 'flexible_attendance') return <FlexibleAttendanceControls fixedPeriod={meetingSlots[0]?.period_number ?? period} allowFullYearEveryDay={isStudyHallCourseName(courseName)} term={term} meetingSlots={meetingSlots} onChange={onChange} />""")
          replace_once(dialog, """function NewCourseFormatControls({ policy, term, meetingSlots, dayType, period, onChange }: {
            policy: CourseTermPolicy
            term: AcademicTerm""", """function NewCourseFormatControls({ policy, courseName, term, meetingSlots, dayType, period, onChange }: {
            policy: CourseTermPolicy
            courseName: string
            term: AcademicTerm""")
          replace_once(dialog, """  if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') return <FlexibleAttendanceControls term={term} meetingSlots={meetingSlots} onChange={onChange} />""",
                       """  if (policy === 'flexible_attendance' || policy === 'sectioned_attendance') return <FlexibleAttendanceControls allowFullYearEveryDay={policy === 'flexible_attendance' && isStudyHallCourseName(courseName)} term={term} meetingSlots={meetingSlots} onChange={onChange} />""")

          replace_once(dialog, """function FlexibleAttendanceControls({ term, meetingSlots, fixedPeriod, onChange }: {
            term: AcademicTerm
            meetingSlots: MeetingSlot[]
            fixedPeriod?: number
            onChange: (term: AcademicTerm, meetingSlots: MeetingSlot[]) => void
          }) {
            const onlyDay = meetingSlots[0]?.day_type ?? 'A'
            const pattern = term === 'full_year' ? `full_year_${onlyDay}` : term
            const fallback = fixedPeriod ?? meetingSlots[0]?.period_number ?? 1
            const aPeriod = meetingSlotsForDay(meetingSlots, 'A')[0]?.period_number ?? fallback
            const semesterPeriod = fixedPeriod ?? aPeriod

            function changePattern(nextPattern: string) {
              if (nextPattern === 'full_year_A' || nextPattern === 'full_year_B') {
                const nextDay = nextPattern.endsWith('_A') ? 'A' : 'B'
                onChange('full_year', [{ day_type: nextDay, period_number: term === 'full_year' ? fallback : semesterPeriod }])
                return
              }
              const nextPeriod = term === 'full_year' ? fallback : semesterPeriod
              onChange(nextPattern as SemesterTerm, [{ day_type: 'A', period_number: nextPeriod }, { day_type: 'B', period_number: nextPeriod }])
            }

            function changePeriod(dayType: DayType, nextPeriod: number) {
              if (term === 'full_year') {
                onChange(term, [{ day_type: onlyDay, period_number: nextPeriod }])
                return
              }
              onChange(term, semesterEveryDaySlots(nextPeriod))
            }

            return <fieldset className="meeting-slot-picker special-attendance-picker"><legend>Attendance pattern</legend>
              <label>Format<select value={pattern} onChange={(event) => changePattern(event.target.value)}><option value="semester_1">Semester 1 · Every day</option><option value="semester_2">Semester 2 · Every day</option><option value="full_year_A">Full Year · A days only</option><option value="full_year_B">Full Year · B days only</option></select></label>
              {fixedPeriod ? <p className="inferred-slot">Period: <strong>{fixedPeriod}</strong></p> : <div className="two-field-row">
                {term === 'full_year' ? <DayPeriodSelect dayType={onlyDay} value={fallback} onChange={changePeriod} /> : <PeriodSelect value={semesterPeriod} onChange={(nextPeriod) => changePeriod('A', nextPeriod)} />}
              </div>}
              <p className="inferred-slot">Meeting slots: <strong>{formatMeetingSlotSummary(meetingSlots)}</strong></p>
            </fieldset>
          }""", """function FlexibleAttendanceControls({ term, meetingSlots, fixedPeriod, allowFullYearEveryDay = false, onChange }: {
            term: AcademicTerm
            meetingSlots: MeetingSlot[]
            fixedPeriod?: number
            allowFullYearEveryDay?: boolean
            onChange: (term: AcademicTerm, meetingSlots: MeetingSlot[]) => void
          }) {
            const onlyDay = meetingSlots[0]?.day_type ?? 'A'
            const fallback = fixedPeriod ?? meetingSlots[0]?.period_number ?? 1
            const aSlots = meetingSlotsForDay(meetingSlots, 'A')
            const bSlots = meetingSlotsForDay(meetingSlots, 'B')
            const fullYearEveryDay = term === 'full_year'
              && aSlots.length === 1
              && bSlots.length === 1
              && aSlots[0].period_number === bSlots[0].period_number
            const pattern = term === 'full_year'
              ? fullYearEveryDay ? 'full_year_every_day' : `full_year_${onlyDay}`
              : term
            const aPeriod = aSlots[0]?.period_number ?? fallback
            const semesterPeriod = fixedPeriod ?? aPeriod

            function changePattern(nextPattern: string) {
              if (nextPattern === 'full_year_A' || nextPattern === 'full_year_B') {
                const nextDay = nextPattern.endsWith('_A') ? 'A' : 'B'
                onChange('full_year', [{ day_type: nextDay, period_number: term === 'full_year' ? fallback : semesterPeriod }])
                return
              }
              const nextPeriod = term === 'full_year' ? fallback : semesterPeriod
              if (nextPattern === 'full_year_every_day') {
                onChange('full_year', semesterEveryDaySlots(nextPeriod))
                return
              }
              onChange(nextPattern as SemesterTerm, semesterEveryDaySlots(nextPeriod))
            }

            function changePeriod(dayType: DayType, nextPeriod: number) {
              if (term === 'full_year') {
                onChange(term, fullYearEveryDay
                  ? semesterEveryDaySlots(nextPeriod)
                  : [{ day_type: onlyDay, period_number: nextPeriod }])
                return
              }
              onChange(term, semesterEveryDaySlots(nextPeriod))
            }

            return <fieldset className="meeting-slot-picker special-attendance-picker"><legend>Attendance pattern</legend>
              <label>Format<select value={pattern} onChange={(event) => changePattern(event.target.value)}><option value="semester_1">Semester 1 · Every day</option><option value="semester_2">Semester 2 · Every day</option><option value="full_year_A">Full Year · A days only</option><option value="full_year_B">Full Year · B days only</option>{allowFullYearEveryDay ? <option value="full_year_every_day">Full Year · Every day</option> : null}</select></label>
              {fixedPeriod ? <p className="inferred-slot">Period: <strong>{fixedPeriod}</strong></p> : <div className="two-field-row">
                {term === 'full_year' && !fullYearEveryDay ? <DayPeriodSelect dayType={onlyDay} value={fallback} onChange={changePeriod} /> : <PeriodSelect value={term === 'full_year' ? aPeriod : semesterPeriod} onChange={(nextPeriod) => changePeriod('A', nextPeriod)} />}
              </div>}
              <p className="inferred-slot">Meeting slots: <strong>{formatMeetingSlotSummary(meetingSlots)}</strong></p>
            </fieldset>
          }""")

