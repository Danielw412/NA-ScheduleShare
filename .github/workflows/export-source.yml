name: Clean temporary implementation workflows

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary workflow scaffolding
        shell: bash
        run: |
          git rm .github/workflows/apply-schedule-import-fixes.yml
          git rm .github/workflows/run-schedule-import-fixes-on-main.yml
          git rm .github/workflows/export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary implementation workflows"
          git push origin HEAD:${{ github.head_ref }}
