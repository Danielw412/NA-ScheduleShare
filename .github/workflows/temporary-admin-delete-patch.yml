name: Temporary admin delete patch

on:
  push:
    branches:
      - fix/admin-class-cleanup-teacher-delete

permissions:
  contents: write

jobs:
  patch-admin-delete:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-class-cleanup-teacher-delete
      - name: Remove class delete prompt
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/AdminPage.tsx')
          text = path.read_text()
          start_marker = '  function permanentlyDeleteClass(course: AdminClassRecord) {'
          end_marker = '\n  function changeGrade(user: AdminUserRecord) {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or text.find(start_marker, start + 1) >= 0:
            raise SystemExit('Expected one permanentlyDeleteClass handler; refusing broad patch')
          replacement = "  function permanentlyDeleteClass(course: AdminClassRecord) {\n    void adminAction('admin_delete_class_section', { p_class_id: course.id, p_reason: 'Permanently deleted from admin console' }, `${course.course_name} was permanently deleted.`)\n  }\n"
          path.write_text(text[:start] + replacement + text[end:])
      - name: Commit branch-only patch
        run: |
          git config user.name "ScheduleShare branch patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AdminPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove admin class delete prompt [agent-patch]"
          git push origin HEAD:fix/admin-class-cleanup-teacher-delete
