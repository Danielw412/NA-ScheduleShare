name: Run schedule import fixes on main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Extract and apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-schedule-import-fixes.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          patch_lines = [line[10:] if line.startswith('          ') else line for line in source[start:end]]
          Path('/tmp/apply_schedule_import_fixes.py').write_text('\n'.join(patch_lines) + '\n')
          PY
          python /tmp/apply_schedule_import_fixes.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:function
      - run: pnpm test -- src/lib/scheduleImport.test.ts
      - run: pnpm typecheck
      - name: Commit tested fixes
        shell: bash
        run: |
          rm .github/workflows/apply-schedule-import-fixes.yml
          rm .github/workflows/run-schedule-import-fixes-on-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix schedule import review false positives"
          git push origin HEAD:main
